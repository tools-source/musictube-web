<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0F1A"/>
      <stop offset="100%" stop-color="#1A0A18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B6B"/>
      <stop offset="100%" stop-color="#FF6B9D"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Waveform bars -->
  <rect x="100" y="210" width="44" height="92" rx="22" fill="url(#accent)" opacity="0.7"/>
  <rect x="162" y="160" width="44" height="192" rx="22" fill="url(#accent)"/>
  <rect x="224" y="190" width="44" height="132" rx="22" fill="url(#accent)" opacity="0.85"/>
  <rect x="286" y="130" width="44" height="252" rx="22" fill="url(#accent)"/>
  <rect x="348" y="180" width="44" height="152" rx="22" fill="url(#accent)" opacity="0.75"/>
  <!-- Glow -->
  <ellipse cx="256" cy="290" rx="160" ry="30" fill="#FF3B6B" opacity="0.12" filter="blur(20px)"/>
</svg>
